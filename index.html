<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b63">
  <title>Blue Packaging QR Attendance</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 16px;
      background: #f3f6fa;
      color: #172b40;
    }
    h2 { margin: 10px 0 16px; }
    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: #fff;
      border-radius: 12px;
      padding: 8px;
      min-height: 80px;
      overflow: hidden;
    }
    #message {
      margin: 18px auto;
      max-width: 500px;
      padding: 16px;
      border-radius: 10px;
      background: #fff;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .small { font-size: 13px; color: #5d6b78; font-weight: normal; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      background: #123b63;
      color: #fff;
      font-size: 16px;
      margin: 6px;
    }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <h2>Blue Packaging – QR Attendance</h2>
  <div id="reader"></div>
  <div id="message">
    Camera start ho raha hai...
    <div class="small">Camera aur Location permission Allow karein.</div>
  </div>
  <button id="restartButton" type="button" onclick="startCamera()">Restart Camera</button>

<script>
"use strict";

// IMPORTANT: Paste the deployed Apps Script Web App URL ending in /exec here.
// Do NOT use the Apps Script editor URL ending in /edit.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyELaImMD8SFldqOivMAWlGNAxczMp2EFq-e5MTSmpQNC_1LAj6LWnx_Yd7W95XrJeD/exec";

let scanner = null;
let scannerRunning = false;
let requestInProgress = false;
let callbackCounter = 0;

function showMessage(message) {
  document.getElementById("message").innerHTML = message;
}

function getApiUrl() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("/exec") === -1 ||
      APPS_SCRIPT_URL.indexOf("PASTE_DEPLOYED") !== -1) {
    throw new Error("Apps Script Web App ka deployed URL (ending /exec) Index.html mein set nahi hai.");
  }
  return APPS_SCRIPT_URL;
}

function callAppsScript(params) {
  return new Promise(function(resolve, reject) {
    let url;
    try {
      url = getApiUrl();
    } catch (err) {
      reject(err);
      return;
    }

    const callbackName = "attendanceJsonpCallback" + (++callbackCounter);
    const script = document.createElement("script");
    let finished = false;

    const cleanup = function() {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      script.remove();
      try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
    };

    const timer = setTimeout(function() {
      cleanup();
      reject(new Error("Apps Script se response nahi mila. Web App URL, deployment aur internet check karein."));
    }, 25000);

    window[callbackName] = function(data) {
      cleanup();
      resolve(data);
    };

    const query = new URLSearchParams(params);
    query.set("callback", callbackName);
    query.set("_", String(Date.now()));
    script.onerror = function() {
      cleanup();
      reject(new Error("Apps Script request load nahi hui. Deployment URL ya access permission check karein."));
    };
    script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + query.toString();
    document.head.appendChild(script);
  });
}

async function startCamera() {
  if (scannerRunning) return;

  const restartButton = document.getElementById("restartButton");
  restartButton.disabled = true;

  try {
    showMessage("📷 Camera permission check ho rahi hai...");

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("Camera ke liye HTTPS aur supported browser zaroori hai.");
    }
    if (typeof Html5Qrcode === "undefined") {
      throw new Error("QR Scanner library load nahi hui. Internet connection check karein.");
    }

    // Request camera permission first so camera labels become available.
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });
    stream.getTracks().forEach(function(track) { track.stop(); });

    const cameras = await Html5Qrcode.getCameras();
    if (!cameras || cameras.length === 0) {
      throw new Error("Is mobile mein camera detect nahi hua.");
    }

    let cameraId = cameras[0].id;
    for (let i = 0; i < cameras.length; i++) {
      const label = String(cameras[i].label || "").toLowerCase();
      if (label.includes("back") || label.includes("rear") || label.includes("environment")) {
        cameraId = cameras[i].id;
        break;
      }
    }

    const reader = document.getElementById("reader");
    reader.innerHTML = "";
    scanner = new Html5Qrcode("reader");

    await scanner.start(
      cameraId,
      {
        fps: 10,
        qrbox: function(width, height) {
          const size = Math.max(180, Math.min(300, Math.floor(Math.min(width, height) * 0.65)));
          return { width: size, height: size };
        }
      },
      onScanSuccess,
      function() { /* normal no-QR frames are ignored */ }
    );

    scannerRunning = true;
    showMessage("📷 Camera ready hai.<br>Employee QR code camera ke saamne rakhiye.");
  } catch (error) {
    console.error("CAMERA START ERROR:", error);
    showMessage("❌ Camera start nahi hua.<br><b>" +
      escapeHtml(error.name || "Camera Error") + "</b><br>" +
      escapeHtml(error.message || String(error)));
  } finally {
    restartButton.disabled = false;
  }
}

async function stopCamera() {
  if (scanner && scannerRunning) {
    try { await scanner.stop(); } catch (err) { console.warn(err); }
    try { await scanner.clear(); } catch (err) { console.warn(err); }
  }
  scannerRunning = false;
}

async function onScanSuccess(decodedText) {
  if (!scannerRunning || requestInProgress) return;

  const employeeId = String(decodedText || "").trim().toUpperCase();
  if (!employeeId) return;

  requestInProgress = true;
  await stopCamera();

  showMessage("👤 Employee ID: " + escapeHtml(employeeId) +
    "<br><br>📍 Mobile location check ho rahi hai...");

  if (!navigator.geolocation) {
    showMessage("❌ Is device/browser mein location service available nahi hai.");
    requestInProgress = false;
    restartCameraAfterDelay();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async function(position) {
      try {
        showMessage("👤 Employee: " + escapeHtml(employeeId) +
          "<br><br>📍 Location mil gayi. Attendance process ho rahi hai...");

        const result = await callAppsScript({
          action: "punch",
          employeeId: employeeId,
          latitude: String(position.coords.latitude),
          longitude: String(position.coords.longitude)
        });

        if (result && result.success) {
          showMessage("✅ " + escapeHtml(result.message || "Attendance marked") +
            (result.distance !== undefined ? "<br><br>📍 Distance: " +
              escapeHtml(String(result.distance)) + " meter" : ""));
        } else {
          showMessage("❌ " + escapeHtml(result && result.message ?
            result.message : "Server se valid response nahi mila."));
        }
      } catch (error) {
        console.error("ATTENDANCE API ERROR:", error);
        showMessage("❌ Connection Error<br><br>" + escapeHtml(error.message || String(error)));
      } finally {
        requestInProgress = false;
        restartCameraAfterDelay();
      }
    },
    function(error) {
      let message = "❌ Mobile ki location nahi mil rahi.";
      if (error.code === 1) message = "❌ Location permission DENIED hai. Browser settings mein Location = Allow karein.";
      if (error.code === 2) message = "❌ Location unavailable hai. Mobile Location/GPS ON karein.";
      if (error.code === 3) message = "❌ Location request timeout. Khuli jagah par dobara try karein.";
      showMessage(message);
      requestInProgress = false;
      restartCameraAfterDelay();
    },
    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }
  );
}

function restartCameraAfterDelay() {
  setTimeout(function() {
    if (!requestInProgress) startCamera();
  }, 3500);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, function(ch) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
  });
}

window.addEventListener("load", function() {
  startCamera();
});
</script>
</body>
</html>
